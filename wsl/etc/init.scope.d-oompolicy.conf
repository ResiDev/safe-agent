# Install to: /etc/systemd/system/init.scope.d/oompolicy.conf   (needs sudo)
#
#   sudo mkdir -p /etc/systemd/system/init.scope.d
#   sudo cp init.scope.d-oompolicy.conf /etc/systemd/system/init.scope.d/oompolicy.conf
#   sudo systemctl daemon-reload
#   systemctl show init.scope -p OOMPolicy     # expect: OOMPolicy=continue
#
# WHY: systemd's DefaultOOMPolicy=stop applies to init.scope. In WSL, everything
# launched from an interactive shell lives in /init.scope — nvim, node, tsgo,
# claude, bwrap — alongside WSL's own /init, the plan9 server, SessionLeader and
# Relay (the Windows<->WSL interop bridge).
#
# So when the OOM killer picks ANY process there, systemd tears down the entire
# scope, times out after 90s, SIGKILLs SessionLeader/Relay, and the whole WSL
# session ends. Every WSL-backed WezTerm tab dies at once.
#
# The VM is not running out of memory at that point. At the 2026-08-06 crash,
# memory recovered to 9.1 GB free within 8 seconds of the OOM, then the VM sat
# healthy for 90 more seconds before dying on "init.scope: Stopping timed out."
#
# This drop-in decouples "lost a process" from "lost the VM": the OOM victim
# still dies, but the scope — and the session — survives.

[Scope]
OOMPolicy=continue
